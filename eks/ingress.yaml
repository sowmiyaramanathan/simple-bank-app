apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-bank-http-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
    - host: "api-simplebank.duckdns.org"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: simple-bank-api-service
                port:
                  number: 80
  tls:
    - hosts:
        - "api-simplebank.duckdns.org"
      secretName: simple-bank-api-cert
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple-bank-grpc-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  ingressClassName: nginx
  rules:
    - host: "gapi-simplebank.duckdns.org"
      http:
        paths:
          - pathType: Prefix
            path: "/"
            backend:
              service:
                name: simple-bank-api-service
                port:
                  number: 90
  tls:
    - hosts:
        - "gapi-simplebank.duckdns.org"
      secretName: simple-bank-gapi-cert
